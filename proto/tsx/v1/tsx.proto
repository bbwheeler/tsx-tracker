syntax = "proto3";

package tsx.v1;

option go_package = "github.com/anomalyco/stocker-list/gen/tsx/v1;tsxv1";

// Company represents a single TSX-listed company.
message Company {
  string symbol = 1;   // e.g. "AC"
  string name = 2;     // legal / display name
  string exchange = 3; // e.g. "TSX"
  string currency = 4; // e.g. "CAD"
}

message ListCompaniesRequest {
  // Max number of companies to return. Defaults to 50, capped at 500.
  int32 page_size = 1;
  // Opaque token from a previous response's next_page_token. Empty for
  // the first page.
  string page_token = 2;
}

message ListCompaniesResponse {
  repeated Company companies = 1;
  // Empty when there are no more results.
  string next_page_token = 2;
  // Total number of companies (independent of paging).
  int32 total_count = 3;
}

message GetCompanyRequest {
  // Stock symbol, e.g. "AC". Case-insensitive.
  string symbol = 1;
}

message GetCompanyResponse {
  Company company = 1;
}

service CompanyService {
  // ListCompanies returns a page of tracked TSX companies.
  rpc ListCompanies(ListCompaniesRequest) returns (ListCompaniesResponse);

  // GetCompany returns a single company by stock symbol.
  // Returns NOT_FOUND if the symbol isn't tracked.
  rpc GetCompany(GetCompanyRequest) returns (GetCompanyResponse);
}
